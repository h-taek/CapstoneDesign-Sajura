<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온보딩 1 매장 정보 — 사주라 목업</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/onboarding/layout.tsx, onboarding/step-store.tsx -->
<body data-page="ob1" data-states="기본:default,입력 오류:error">
<main class="min-h-dvh bg-[#f3f4f6] p-6">
  <div class="mx-auto w-full max-w-2xl space-y-6 py-6">
    <header class="space-y-1">
      <h1 class="text-3xl font-semibold text-[#101828]">매장 온보딩</h1>
      <p class="text-base text-[#364153]">기본 정보를 4단계로 입력하면 메인 화면으로 이동합니다.</p>
    </header>
    <ol class="grid grid-cols-4 gap-2" aria-label="온보딩 단계">
      <li aria-current="step" class="flex flex-col items-start rounded-xl border border-[#7a5eff] bg-white px-3 py-2"><span class="text-xs text-[#7a5eff]">Step 1</span><a href="04_onboarding-store.html" class="text-sm font-medium text-[#101828]">매장 정보</a></li>
      <li class="flex flex-col items-start rounded-xl border border-dashed border-[#d1d5dc] bg-white px-3 py-2 text-[#99a1af]"><span class="text-xs">Step 2</span><span class="text-sm font-medium">POS 연동</span></li>
      <li class="flex flex-col items-start rounded-xl border border-dashed border-[#d1d5dc] bg-white px-3 py-2 text-[#99a1af]"><span class="text-xs">Step 3</span><span class="text-sm font-medium">메뉴 등록</span></li>
      <li class="flex flex-col items-start rounded-xl border border-dashed border-[#d1d5dc] bg-white px-3 py-2 text-[#99a1af]"><span class="text-xs">Step 4</span><span class="text-sm font-medium">확인</span></li>
    </ol>
    <section class="rounded-2xl bg-white p-8 shadow-sm">
      <form class="space-y-4" novalidate>
        <div class="flex flex-col gap-1">
          <label for="store_name" class="text-sm font-medium text-slate-700">매장명</label>
          <input id="store_name" value="사주라 화덕피자 성수점" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm shadow-sm">
        </div>
        <div class="flex flex-col gap-1">
          <label for="business_type" class="text-sm font-medium text-slate-700">업종</label>
          <select id="business_type" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 pr-8 text-sm shadow-sm">
            <option disabled>선택하세요</option><option>카페</option><option>한식</option><option selected>양식</option><option>분식</option><option>주점</option><option>기타</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-1">
            <label for="store_size" class="text-sm font-medium text-slate-700">매장 규모</label>
            <select id="store_size" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 pr-8 text-sm shadow-sm">
              <option>소형 (~10석)</option><option selected>중형 (11~30석)</option><option>대형 (31석~)</option>
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label for="operation_type" class="text-sm font-medium text-slate-700">운영 형태</label>
            <select id="operation_type" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 pr-8 text-sm shadow-sm">
              <option>홀</option><option>배달</option><option selected>홀+배달</option>
            </select>
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <label for="address" class="text-sm font-medium text-slate-700">주소</label>
          <input id="address" value="서울 성동구 성수이로 00" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm shadow-sm">
        </div>
        <div class="flex flex-col gap-1">
          <label for="phone" class="text-sm font-medium text-slate-700">전화번호</label>
          <input id="phone" inputmode="tel" value="02-000-0000" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm shadow-sm">
          <p data-when="default" class="text-xs text-slate-500">자동으로 하이픈이 채워집니다.</p>
          <p data-when="error" class="text-xs text-red-600" role="alert">전화번호 형식이 올바르지 않습니다.</p>
        </div>
        <div class="flex justify-end pt-2">
          <button type="submit" data-go="05_onboarding-pos.html" class="inline-flex h-10 items-center justify-center gap-2 rounded-md bg-slate-900 px-4 text-sm font-medium text-white transition-colors hover:bg-slate-800">다음</button>
        </div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
