<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온보딩 3 메뉴 등록 — 사주라 목업</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/onboarding/layout.tsx, onboarding/step-menus.tsx -->
<body data-page="ob3">
<main class="min-h-dvh bg-[#f3f4f6] p-6">
  <div class="mx-auto w-full max-w-2xl space-y-6 py-6">
    <header class="space-y-1">
      <h1 class="text-3xl font-semibold text-[#101828]">매장 온보딩</h1>
      <p class="text-base text-[#364153]">기본 정보를 4단계로 입력하면 메인 화면으로 이동합니다.</p>
    </header>
    <ol class="grid grid-cols-4 gap-2" aria-label="온보딩 단계">
      <li class="flex flex-col items-start rounded-xl border border-[#d1d5dc] bg-white px-3 py-2"><span class="text-xs">Step 1</span><a href="04_onboarding-store.html" class="text-sm font-medium text-[#364153]">매장 정보</a></li>
      <li class="flex flex-col items-start rounded-xl border border-[#d1d5dc] bg-white px-3 py-2"><span class="text-xs">Step 2</span><a href="05_onboarding-pos.html" class="text-sm font-medium text-[#364153]">POS 연동</a></li>
      <li aria-current="step" class="flex flex-col items-start rounded-xl border border-[#7a5eff] bg-white px-3 py-2"><span class="text-xs text-[#7a5eff]">Step 3</span><a href="06_onboarding-menus.html" class="text-sm font-medium text-[#101828]">메뉴 등록</a></li>
      <li class="flex flex-col items-start rounded-xl border border-dashed border-[#d1d5dc] bg-white px-3 py-2 text-[#99a1af]"><span class="text-xs">Step 4</span><span class="text-sm font-medium">확인</span></li>
    </ol>
    <section class="rounded-2xl bg-white p-8 shadow-sm">
      <form class="space-y-6" novalidate>
        <div class="space-y-1">
          <h2 class="text-2xl font-semibold text-[#101828]">메뉴 등록</h2>
          <p class="text-base text-[#364153]">판매하는 메뉴를 등록해주세요.</p>
        </div>

        <div class="space-y-3">
          <!-- 메뉴 행 1 -->
          <div class="grid grid-cols-12 items-start gap-3 rounded-xl border border-[#d1d5dc] p-4">
            <div class="col-span-4 flex flex-col gap-1"><label class="text-sm font-medium text-slate-700">메뉴명</label><input value="마르게리타 화덕피자" class="h-11 w-full rounded-xl border border-[#d1d5dc] bg-[#f3f4f6] px-3 text-sm shadow-sm"></div>
            <div class="col-span-3 flex flex-col gap-1"><label class="text-sm font-medium text-slate-700">카테고리</label><input value="피자" class="h-11 w-full rounded-xl border border-[#d1d5dc] bg-[#f3f4f6] px-3 text-sm shadow-sm"></div>
            <div class="col-span-3 flex flex-col gap-1"><label class="text-sm font-medium text-slate-700">단가(원)</label><input type="number" value="16000" class="h-11 w-full rounded-xl border border-[#d1d5dc] bg-[#f3f4f6] px-3 text-sm shadow-sm"></div>
            <div class="col-span-2 flex justify-end pt-7"><button type="button" aria-label="메뉴 삭제" class="inline-flex h-11 items-center justify-center gap-2 rounded-full bg-transparent px-4 text-sm font-medium text-[#99a1af] hover:bg-red-50 hover:text-red-600"><span data-icon="trash" class="size-4"></span></button></div>
            <div class="col-span-12 flex gap-4 text-sm text-[#364153]">
              <label class="flex items-center gap-2"><input type="checkbox" checked class="accent-[#7a5eff]"> 판매 활성</label>
              <label class="flex items-center gap-2"><input type="checkbox" checked class="accent-[#7a5eff]">재고 차감</label>
            </div>
          </div>
          <!-- 메뉴 행 2 -->
          <div class="grid grid-cols-12 items-start gap-3 rounded-xl border border-[#d1d5dc] p-4">
            <div class="col-span-4 flex flex-col gap-1"><label class="text-sm font-medium text-slate-700">메뉴명</label><input value="페페로니 듬뿍 화덕피자" class="h-11 w-full rounded-xl border border-[#d1d5dc] bg-[#f3f4f6] px-3 text-sm shadow-sm"></div>
            <div class="col-span-3 flex flex-col gap-1"><label class="text-sm font-medium text-slate-700">카테고리</label><input value="피자" class="h-11 w-full rounded-xl border border-[#d1d5dc] bg-[#f3f4f6] px-3 text-sm shadow-sm"></div>
            <div class="col-span-3 flex flex-col gap-1"><label class="text-sm font-medium text-slate-700">단가(원)</label><input type="number" value="18000" class="h-11 w-full rounded-xl border border-[#d1d5dc] bg-[#f3f4f6] px-3 text-sm shadow-sm"></div>
            <div class="col-span-2 flex justify-end pt-7"><button type="button" aria-label="메뉴 삭제" class="inline-flex h-11 items-center justify-center gap-2 rounded-full bg-transparent px-4 text-sm font-medium text-[#99a1af] hover:bg-red-50 hover:text-red-600"><span data-icon="trash" class="size-4"></span></button></div>
            <div class="col-span-12 flex gap-4 text-sm text-[#364153]">
              <label class="flex items-center gap-2"><input type="checkbox" checked class="accent-[#7a5eff]"> 판매 활성</label>
              <label class="flex items-center gap-2"><input type="checkbox" checked class="accent-[#7a5eff]">재고 차감</label>
            </div>
          </div>
          <!-- 메뉴 행 3 -->
          <div class="grid grid-cols-12 items-start gap-3 rounded-xl border border-[#d1d5dc] p-4">
            <div class="col-span-4 flex flex-col gap-1"><label class="text-sm font-medium text-slate-700">메뉴명</label><input value="콜라" class="h-11 w-full rounded-xl border border-[#d1d5dc] bg-[#f3f4f6] px-3 text-sm shadow-sm"></div>
            <div class="col-span-3 flex flex-col gap-1"><label class="text-sm font-medium text-slate-700">카테고리</label><input value="음료" class="h-11 w-full rounded-xl border border-[#d1d5dc] bg-[#f3f4f6] px-3 text-sm shadow-sm"></div>
            <div class="col-span-3 flex flex-col gap-1"><label class="text-sm font-medium text-slate-700">단가(원)</label><input type="number" value="2500" class="h-11 w-full rounded-xl border border-[#d1d5dc] bg-[#f3f4f6] px-3 text-sm shadow-sm"></div>
            <div class="col-span-2 flex justify-end pt-7"><button type="button" aria-label="메뉴 삭제" class="inline-flex h-11 items-center justify-center gap-2 rounded-full bg-transparent px-4 text-sm font-medium text-[#99a1af] hover:bg-red-50 hover:text-red-600"><span data-icon="trash" class="size-4"></span></button></div>
            <div class="col-span-12 flex gap-4 text-sm text-[#364153]">
              <label class="flex items-center gap-2"><input type="checkbox" checked class="accent-[#7a5eff]"> 판매 활성</label>
              <label class="flex items-center gap-2"><input type="checkbox" class="accent-[#7a5eff]">재고 차감</label>
            </div>
          </div>
        </div>

        <button type="button" class="inline-flex h-10 items-center justify-center gap-2 rounded-full border border-[#d1d5dc] bg-white px-4 text-sm font-medium text-[#364153] transition-colors hover:bg-[#f3f4f6]"><span data-icon="plus" class="size-4"></span> 메뉴 추가</button>

        <div class="flex justify-between pt-2">
          <button type="button" data-go="05_onboarding-pos.html" class="inline-flex h-11 items-center justify-center gap-2 rounded-full border border-[#d1d5dc] bg-white px-6 text-sm font-medium text-[#364153] transition-colors hover:bg-[#f3f4f6]">이전</button>
          <button type="submit" data-go="07_onboarding-confirm.html" class="inline-flex h-11 items-center justify-center gap-2 rounded-full bg-[#7a5eff] px-8 text-sm font-semibold text-white transition-colors hover:bg-[#6a4eef]">다음</button>
        </div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
