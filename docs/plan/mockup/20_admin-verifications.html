<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 심사 — 사주라 목업</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/admin/verifications.tsx (셸 없음, 네비 링크 없이 직접 진입) -->
<body data-page="admin" data-states="목록:default,등록증 보기:cert,반려 입력:reject,대기 없음:empty">
<main class="mx-auto max-w-3xl p-6">
  <h1 class="mb-4 text-2xl font-semibold text-slate-900">사업자 검증 심사</h1>

  <p data-when="empty" class="text-sm text-slate-500">심사 대기 중인 항목이 없습니다.</p>

  <ul data-when="default cert reject" class="space-y-4">
    <li class="rounded-lg border border-slate-200 p-4">
      <div class="flex items-center justify-between">
        <div>
          <p class="font-medium text-slate-900">owner@sajura.kr</p>
          <p class="text-sm text-slate-500">사업자번호: 123-45-67890</p>
        </div>
        <div class="flex gap-2">
          <button type="button" data-set-state="cert" class="inline-flex h-9 items-center justify-center gap-2 rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-900 transition-colors hover:bg-slate-50">등록증 보기</button>
          <button type="button" data-set-state="empty" class="inline-flex h-9 items-center justify-center gap-2 rounded-md bg-slate-900 px-3 text-sm font-medium text-white transition-colors hover:bg-slate-800">승인</button>
          <button type="button" data-set-state="reject" class="inline-flex h-9 items-center justify-center gap-2 rounded-md border border-slate-300 bg-white px-3 text-sm font-medium text-slate-900 transition-colors hover:bg-slate-50">반려</button>
        </div>
      </div>

      <div data-when="cert" class="mt-3 grid h-64 w-full place-items-center rounded border border-slate-200 bg-slate-100 text-sm text-slate-400">사업자등록증 미리보기 (이미지 또는 PDF)</div>

      <div data-when="reject" class="mt-3 flex gap-2">
        <input placeholder="반려 사유" value="사업자등록증 이미지가 흐려 번호를 확인할 수 없습니다" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm shadow-sm">
        <button type="button" data-set-state="empty" class="inline-flex h-9 shrink-0 items-center justify-center gap-2 rounded-md bg-slate-900 px-3 text-sm font-medium text-white transition-colors hover:bg-slate-800">반려 확정</button>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
