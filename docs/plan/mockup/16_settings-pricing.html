<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단가 관리 — 사주라 목업</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/settings/pricing.tsx -->
<body data-page="pricing" data-states="목록:default,단가 수정:edit">
<div data-shell="settings">
  <div class="space-y-6">
    <header class="space-y-1">
      <h1 class="text-2xl font-semibold text-[#101828]">단가 관리</h1>
      <p class="text-sm text-[#99a1af]">메뉴별 판매 단가를 조회하고 수정합니다.</p>
    </header>

    <div class="overflow-hidden rounded-xl border border-[#d1d5dc] bg-white">
      <table class="w-full text-left text-sm">
        <thead class="bg-[#fafafa] text-[#61646b]">
          <tr>
            <th class="px-4 py-3 font-medium">메뉴</th>
            <th class="px-4 py-3 font-medium">카테고리</th>
            <th class="px-4 py-3 font-medium">단가</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-t border-[#eef1f4]">
            <td class="px-4 py-3 font-medium text-[#364153]">불새우 루꼴라 화덕피자</td>
            <td class="px-4 py-3 text-[#99a1af]">피자</td>
            <td class="px-4 py-3"><span class="text-[#364153]">₩19,000</span></td>
            <td class="px-4 py-3 text-right"><button type="button" data-set-state="edit" class="text-sm font-medium text-[#7a5eff] hover:underline">수정</button></td>
          </tr>
          <tr class="border-t border-[#eef1f4]">
            <td class="px-4 py-3 font-medium text-[#364153]">페페로니 듬뿍 화덕피자</td>
            <td class="px-4 py-3 text-[#99a1af]">피자</td>
            <td class="px-4 py-3"><span data-when="default" class="text-[#364153]">₩17,900</span><input data-when="edit" type="number" min="0" value="18500" class="h-9 w-28 rounded-lg border border-[#d1d5dc] px-2 text-sm"></td>
            <td class="px-4 py-3 text-right"><span data-when="default"><button type="button" data-set-state="edit" class="text-sm font-medium text-[#7a5eff] hover:underline">수정</button></span><div data-when="edit" class="flex justify-end gap-2"><button type="button" data-set-state="default" class="text-sm text-[#99a1af] hover:text-[#364153]">취소</button><button type="button" data-set-state="default" class="inline-flex h-8 items-center justify-center gap-2 rounded-full bg-[#7a5eff] px-4 text-xs font-semibold text-white hover:bg-[#6a4eef]">저장</button></div></td>
          </tr>
          <tr class="border-t border-[#eef1f4]">
            <td class="px-4 py-3 font-medium text-[#364153]">마르게리타 화덕피자</td>
            <td class="px-4 py-3 text-[#99a1af]">피자</td>
            <td class="px-4 py-3"><span class="text-[#364153]">₩15,900</span></td>
            <td class="px-4 py-3 text-right"><button type="button" data-set-state="edit" class="text-sm font-medium text-[#7a5eff] hover:underline">수정</button></td>
          </tr>
          <tr class="border-t border-[#eef1f4]">
            <td class="px-4 py-3 font-medium text-[#364153]">트러플 버섯 화덕피자</td>
            <td class="px-4 py-3 text-[#99a1af]">피자</td>
            <td class="px-4 py-3"><span class="text-[#364153]">₩21,000</span></td>
            <td class="px-4 py-3 text-right"><button type="button" data-set-state="edit" class="text-sm font-medium text-[#7a5eff] hover:underline">수정</button></td>
          </tr>
          <tr class="border-t border-[#eef1f4]">
            <td class="px-4 py-3 font-medium text-[#364153]">머스크멜론하몽</td>
            <td class="px-4 py-3 text-[#99a1af]">샐러드</td>
            <td class="px-4 py-3"><span class="text-[#364153]">₩18,000</span></td>
            <td class="px-4 py-3 text-right"><button type="button" data-set-state="edit" class="text-sm font-medium text-[#7a5eff] hover:underline">수정</button></td>
          </tr>
          <tr class="border-t border-[#eef1f4]">
            <td class="px-4 py-3 font-medium text-[#364153]">얼큰 바지락 술찜</td>
            <td class="px-4 py-3 text-[#99a1af]">요리</td>
            <td class="px-4 py-3"><span class="text-[#364153]">₩18,000</span></td>
            <td class="px-4 py-3 text-right"><button type="button" data-set-state="edit" class="text-sm font-medium text-[#7a5eff] hover:underline">수정</button></td>
          </tr>
          <tr class="border-t border-[#eef1f4]">
            <td class="px-4 py-3 font-medium text-[#364153]">하우스 레드 와인 (글라스)</td>
            <td class="px-4 py-3 text-[#99a1af]">주류</td>
            <td class="px-4 py-3"><span class="text-[#364153]">₩9,000</span></td>
            <td class="px-4 py-3 text-right"><button type="button" data-set-state="edit" class="text-sm font-medium text-[#7a5eff] hover:underline">수정</button></td>
          </tr>
          <tr class="border-t border-[#eef1f4]">
            <td class="px-4 py-3 font-medium text-[#364153]">레몬 에이드</td>
            <td class="px-4 py-3 text-[#99a1af]">자동등록</td>
            <td class="px-4 py-3"><span class="text-[#364153]">₩6,500</span></td>
            <td class="px-4 py-3 text-right"><button type="button" data-set-state="edit" class="text-sm font-medium text-[#7a5eff] hover:underline">수정</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
