<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온보딩 1 매장 정보 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/onboarding/layout.tsx, onboarding/step-store.tsx, components/ui/button.tsx·field.tsx -->
<body data-page="ob1" data-sky="22:00" data-states="기본:default,입력 오류:error">
<div data-backdrop></div>
<main class="min-h-dvh bg-canvas px-4 py-6 sm:p-6">
  <div class="glass-strong mx-auto w-full max-w-2xl space-y-6 rounded-[1.75rem] p-5 sm:p-8 lg:my-6">
    <header class="space-y-1">
      <p class="text-sm font-semibold text-brand">1 / 4 단계</p>
      <h1 class="text-[1.75rem] font-bold tracking-tight text-ink">매장 온보딩</h1>
      <p class="text-base text-ink-3">기본 정보를 4단계로 입력하면 메인 화면으로 이동합니다.</p>
    </header>
    <!-- 단계 표시 — 지난 단계는 체크, 지금 단계는 보라. 좁은 화면(sm 미만)은 지금 단계 이름만 보인다 -->
    <ol class="grid grid-cols-4 gap-2" aria-label="온보딩 단계">
      <li aria-current="step" class="flex flex-col items-center gap-2 text-center">
        <span class="h-1.5 w-full rounded-full bg-brand"></span>
        <span class="flex items-center gap-1.5"><span class="flex size-6 shrink-0 items-center justify-center rounded-full text-xs font-bold bg-brand text-white">1</span><a href="05_onboarding-store.html" aria-current="page" class="text-sm font-semibold whitespace-nowrap text-ink">매장 정보</a></span>
      </li>
      <li class="flex flex-col items-center gap-2 text-center">
        <span class="h-1.5 w-full rounded-full bg-line"></span>
        <span class="flex items-center gap-1.5"><span class="flex size-6 shrink-0 items-center justify-center rounded-full text-xs font-bold bg-line-soft text-ink-4">2</span><a class="text-sm font-semibold whitespace-nowrap text-ink-4 hidden sm:inline">POS 연동</a></span>
      </li>
      <li class="flex flex-col items-center gap-2 text-center">
        <span class="h-1.5 w-full rounded-full bg-line"></span>
        <span class="flex items-center gap-1.5"><span class="flex size-6 shrink-0 items-center justify-center rounded-full text-xs font-bold bg-line-soft text-ink-4">3</span><a class="text-sm font-semibold whitespace-nowrap text-ink-4 hidden sm:inline">메뉴 등록</a></span>
      </li>
      <li class="flex flex-col items-center gap-2 text-center">
        <span class="h-1.5 w-full rounded-full bg-line"></span>
        <span class="flex items-center gap-1.5"><span class="flex size-6 shrink-0 items-center justify-center rounded-full text-xs font-bold bg-line-soft text-ink-4">4</span><a class="text-sm font-semibold whitespace-nowrap text-ink-4 hidden sm:inline">확인</a></span>
      </li>
    </ol>
    <section class="rounded-2xl p-5 sm:p-8 glass-card">
      <form class="space-y-4" novalidate>
        <div class="flex flex-col gap-1.5">
          <label for="store_name" class="text-[0.95rem] font-semibold text-ink-2">매장명</label>
          <input id="store_name" autocomplete="organization" value="사주라 화덕피자 성수점" class="h-12 w-full rounded-xl border border-line bg-white/70 px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft disabled:bg-subtle disabled:text-ink-3">
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="business_type" class="text-[0.95rem] font-semibold text-ink-2">업종</label>
          <select id="business_type" class="h-12 w-full rounded-xl border border-line bg-white/70 px-4 pr-8 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft disabled:bg-subtle disabled:text-ink-3">
            <option disabled>선택하세요</option><option>카페</option><option>한식</option><option selected>양식</option><option>분식</option><option>주점</option><option>기타</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-1.5">
            <label for="store_size" class="text-[0.95rem] font-semibold text-ink-2">매장 규모</label>
            <select id="store_size" class="h-12 w-full rounded-xl border border-line bg-white/70 px-4 pr-8 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft disabled:bg-subtle disabled:text-ink-3">
              <option>소형 (~10석)</option><option selected>중형 (11~30석)</option><option>대형 (31석~)</option>
            </select>
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="operation_type" class="text-[0.95rem] font-semibold text-ink-2">운영 형태</label>
            <select id="operation_type" class="h-12 w-full rounded-xl border border-line bg-white/70 px-4 pr-8 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft disabled:bg-subtle disabled:text-ink-3">
              <option>홀</option><option>배달</option><option selected>홀+배달</option>
            </select>
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="address" class="text-[0.95rem] font-semibold text-ink-2">주소</label>
          <input id="address" autocomplete="street-address" value="서울 성동구 성수이로 00" class="h-12 w-full rounded-xl border border-line bg-white/70 px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft disabled:bg-subtle disabled:text-ink-3">
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="phone" class="text-[0.95rem] font-semibold text-ink-2">전화번호</label>
          <input id="phone" inputmode="tel" autocomplete="tel" value="02-000-0000" class="h-12 w-full rounded-xl border border-line bg-white/70 px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft disabled:bg-subtle disabled:text-ink-3">
          <!-- 오류가 있으면 안내 문구 대신 오류를 보인다 -->
          <p data-when="default" class="text-sm text-ink-3">자동으로 하이픈이 채워집니다.</p>
          <p data-when="error" class="text-sm text-danger" role="alert">전화번호 형식이 올바르지 않습니다.</p>
        </div>
        <div class="flex justify-end pt-2">
          <button type="submit" data-go="06_onboarding-pos.html" data-testid="store-next" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-xl bg-brand px-5 text-[0.95rem] font-semibold whitespace-nowrap text-white transition-colors hover:bg-brand-strong disabled:cursor-not-allowed disabled:bg-ink-4">다음</button>
        </div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
