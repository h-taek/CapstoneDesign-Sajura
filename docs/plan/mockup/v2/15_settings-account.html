<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계정 정보 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/settings/account.tsx, components/ui/button.tsx, components/ui/field.tsx -->
<body data-page="account" data-states="기본:default,저장 완료:saved,탈퇴 확인:withdraw">
<div data-shell="settings" data-layout="open" data-title="계정 정보" data-back="12_settings.html">
  <div class="mx-auto max-w-3xl space-y-6">
    <header class="space-y-1">
      <h1 class="hidden text-[1.75rem] font-bold tracking-tight text-ink lg:block">계정 정보</h1>
      <p class="text-sm text-ink-2">owner@sajura.kr</p>
    </header>

    <!-- 입력칸은 FormField + Input에 h-11·bg-subtle을 덮어쓴 결과 -->
    <form class="space-y-4 rounded-xl p-6 glass-card">
      <h2 class="text-lg font-semibold text-ink">내 정보</h2>
      <div class="flex flex-col gap-1.5">
        <label for="name" class="text-[0.95rem] font-semibold text-ink-2">이름</label>
        <input id="name" type="text" value="김사주" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="store_name" class="text-[0.95rem] font-semibold text-ink-2">매장명</label>
        <input id="store_name" type="text" value="사주라 화덕피자 성수점" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
      </div>
      <div class="flex justify-end">
        <button type="submit" data-set-state="saved" class="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-full bg-brand px-6 text-[0.95rem] font-semibold whitespace-nowrap text-white transition-colors hover:bg-brand-strong disabled:cursor-not-allowed disabled:bg-ink-4">저장</button>
      </div>
      <p data-when="saved" class="text-sm text-emerald-600">저장되었습니다.</p>
    </form>

    <form class="space-y-4 rounded-xl p-6 glass-card">
      <h2 class="text-lg font-semibold text-ink">매장 정보</h2>
      <div class="flex flex-col gap-1.5">
        <label for="business_type" class="text-[0.95rem] font-semibold text-ink-2">업종</label>
        <input id="business_type" type="text" value="양식" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="address" class="text-[0.95rem] font-semibold text-ink-2">주소</label>
        <input id="address" type="text" value="서울특별시 성동구 연무장길 00" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="phone" class="text-[0.95rem] font-semibold text-ink-2">전화번호</label>
        <input id="phone" type="text" value="02-000-0000" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
      </div>
      <div class="flex justify-end">
        <button type="submit" class="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-full bg-brand px-6 text-[0.95rem] font-semibold whitespace-nowrap text-white transition-colors hover:bg-brand-strong disabled:cursor-not-allowed disabled:bg-ink-4">저장</button>
      </div>
    </form>

    <form class="space-y-4 rounded-xl p-6 glass-card">
      <h2 class="text-lg font-semibold text-ink">비밀번호 변경</h2>
      <div class="flex flex-col gap-1.5">
        <label for="current_password" class="text-[0.95rem] font-semibold text-ink-2">현재 비밀번호</label>
        <input id="current_password" type="password" autocomplete="current-password" value="" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="new_password" class="text-[0.95rem] font-semibold text-ink-2">새 비밀번호</label>
        <input id="new_password" type="password" autocomplete="new-password" value="" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="new_password_confirm" class="text-[0.95rem] font-semibold text-ink-2">새 비밀번호 확인</label>
        <input id="new_password_confirm" type="password" autocomplete="new-password" value="" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
      </div>
      <div class="flex justify-end">
        <button type="submit" class="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-full bg-brand px-6 text-[0.95rem] font-semibold whitespace-nowrap text-white transition-colors hover:bg-brand-strong disabled:cursor-not-allowed disabled:bg-ink-4">비밀번호 변경</button>
      </div>
    </form>

    <!-- 회원 탈퇴 — 이메일 가입(LOCAL) 계정이라 비밀번호 확인칸이 보인다 -->
    <section class="space-y-4 rounded-xl border-red-200 p-6 glass-card">
      <h2 class="text-lg font-semibold text-ink">회원 탈퇴</h2>
      <p class="text-sm text-ink-3">탈퇴하면 즉시 로그인할 수 없고 되돌릴 수 없습니다. 30일 뒤 매장·판매·재고·발주 데이터와 사업자등록증이 모두 삭제되며, 그 전까지 같은 계정으로 다시 가입할 수 없습니다.</p>
      <div class="flex flex-col gap-1.5">
        <label for="withdraw_password" class="text-[0.95rem] font-semibold text-ink-2">비밀번호 확인</label>
        <input data-when="default saved" id="withdraw_password" type="password" autocomplete="current-password" value="" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
        <input data-when="withdraw" type="password" autocomplete="current-password" value="password1234" class="h-11 w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:ring-4 focus:ring-brand-soft focus:outline-none disabled:bg-subtle disabled:text-ink-3">
      </div>
      <label class="flex items-center gap-2 text-sm text-ink-2">
        <input data-when="default saved" type="checkbox" class="size-4 accent-red-600">
        <input data-when="withdraw" type="checkbox" checked class="size-4 accent-red-600">
        30일 뒤 모든 데이터가 영구 삭제됨을 확인했습니다.
      </label>
      <div class="flex justify-end">
        <button type="button" disabled data-when="default saved" class="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-full bg-red-600 px-6 text-[0.95rem] font-semibold whitespace-nowrap text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:bg-ink-4">회원 탈퇴</button>
        <button type="button" data-when="withdraw" data-go="02_login.html?state=withdrawn" class="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-full bg-red-600 px-6 text-[0.95rem] font-semibold whitespace-nowrap text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:bg-ink-4">회원 탈퇴</button>
      </div>
    </section>
  </div>
</div>
</body>
</html>
