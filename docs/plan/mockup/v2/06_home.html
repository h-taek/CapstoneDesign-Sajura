<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- v2 홈 — 배치 잡는 중. 웹은 위 3열·아래 2열 카드가 패널 높이를 채운다(내용은 아직 비움). 앱은 세로로 쌓는다 -->
<body data-page="home" data-states="기본:default">
<div data-shell="home">
  <!-- 머리글 — 왼쪽 위, 제목·부제 두 줄(다른 대시보드 화면과 같은 높이) -->
  <header class="mb-3 space-y-1">
    <h1 class="text-xl font-bold tracking-tight text-ink lg:text-[1.75rem]">Test</h1>
    <p class="text-[0.95rem] text-ink-3">Test</p>
  </header>
  <div class="grid gap-4 lg:h-[calc(100%-68px-0.75rem)] lg:grid-rows-2">
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
      <section class="min-h-40 rounded-2xl glass-card"></section>
      <!-- 작은 카드 2×2 — 첫 칸은 포인트 색 유리 -->
      <section class="grid min-h-40 grid-cols-2 grid-rows-2 gap-3 rounded-2xl p-3 glass-card">
        <div class="rounded-xl glass-brand"></div>
        <div class="rounded-xl glass-card"></div>
        <div class="rounded-xl glass-card"></div>
        <div class="rounded-xl glass-card"></div>
      </section>
      <section class="min-h-40 rounded-2xl glass-card"></section>
    </div>
    <!-- 아래 줄 1:2 — 위 줄 3칸 격자에 세로선을 맞춘다 -->
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
      <section class="min-h-40 rounded-2xl glass-card"></section>
      <section class="min-h-40 rounded-2xl glass-card lg:col-span-2"></section>
    </div>
  </div>
</div>
</body>
</html>
