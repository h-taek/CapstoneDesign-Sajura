<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/register.tsx, components/ui/button.tsx·field.tsx. v2는 AuthHeroPanel(왼쪽 설명 글)을 빼고 이름표 대신 안내 글만 둔다 -->
<body data-page="register" data-states="기본:default,입력 오류:error">
<div data-backdrop></div>
<!-- v2 — 로그인과 같은 카드 한 장(가운데 정렬, 맨 위 브랜드색 Sajura·제목, 안내 글만 있는 입력칸). 처음 여는 빈 폼이라 안내 글이 보이게 값은 비운다 -->
<main class="grid min-h-dvh place-items-center px-3 pt-16 pb-[6vh] sm:px-6 sm:pb-[8vh]">
  <section class="glass-strong w-full max-w-[440px] rounded-[1.75rem] p-6 text-center sm:p-7">
    <p class="text-[2rem] leading-none font-extrabold tracking-tight text-brand">Sajura</p>
    <h1 class="mt-4 text-[1.6rem] leading-snug font-extrabold tracking-tight text-ink">사장님 계정 만들기</h1>
    <p class="mt-1.5 text-base text-ink-2">가입하고 사업자 인증을 마치면 바로 시작할 수 있어요.</p>

    <form class="mt-7 space-y-2.5 text-left" novalidate>
      <input id="email" type="email" autocomplete="email" aria-label="이메일" placeholder="이메일" class="h-[52px] w-full rounded-xl border border-line bg-white/70 px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft">
      <p data-when="error" class="px-1 text-sm text-red-600" role="alert">이미 가입된 이메일입니다.</p>
      <input id="name" autocomplete="name" aria-label="이름" placeholder="이름" class="h-[52px] w-full rounded-xl border border-line bg-white/70 px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft">
      <input id="password" type="password" autocomplete="new-password" aria-label="비밀번호(8자 이상)" placeholder="비밀번호 (8자 이상)" class="h-[52px] w-full rounded-xl border border-line bg-white/70 px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft">
      <input id="password_confirm" type="password" autocomplete="new-password" aria-label="비밀번호 확인" placeholder="비밀번호 확인" class="h-[52px] w-full rounded-xl border border-line bg-white/70 px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft">
      <p data-when="error" class="px-1 text-sm text-red-600" role="alert">비밀번호가 일치하지 않습니다.</p>

      <button type="submit" data-go="02_login.html?state=registered" class="!mt-4 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">가입하기</button>
    </form>

    <p class="mt-4 text-[0.95rem] text-ink-3">이미 계정이 있으신가요? <a href="02_login.html" class="font-bold text-ink hover:underline">로그인</a></p>
  </section>
</main>
</body>
</html>
