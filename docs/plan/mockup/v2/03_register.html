<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/register.tsx, components/ui/button.tsx·field.tsx. v2는 AuthHeroPanel(왼쪽 설명 글)을 빼고, 레퍼런스(daglo 회원가입)처럼 한 화면에 칸 하나씩 단계로 나눈다 -->
<body data-page="register" data-states="1 이메일·약관:s1,2 이름:s2,3 비밀번호:s3,약관 미동의:terms-error,이메일 오류:email-error,비밀번호 오류:pw-error">
<div data-backdrop></div>
<!-- v2 — 카드 없이 밤하늘 위에 바로. 한 화면에 칸 하나씩(이메일·약관 동의 → 이름 → 비밀번호), 위에 3칸 진행 막대.
     '계속'은 다음 단계 상태로 넘긴다. 하늘 위라 브랜드 보라 대신 밝은 보라(#b3a4ff)를 강조색으로 쓴다 -->
<p class="fixed top-6 left-6 z-10 text-[1.75rem] leading-none font-extrabold tracking-tight text-[#b3a4ff] sm:top-8 sm:left-10">Sajura</p>
<main class="grid min-h-dvh place-items-center px-5 pt-14 pb-[29vh] text-center text-white">
  <section class="w-full max-w-[400px]">
    <div data-when="s1">
      <div class="flex justify-center gap-2" aria-label="1 / 3 단계"><span class="h-1 w-9 rounded-full bg-[#b3a4ff]"></span><span class="h-1 w-9 rounded-full bg-white/20"></span><span class="h-1 w-9 rounded-full bg-white/20"></span></div>
      <h1 class="mt-7 text-[1.75rem] font-extrabold tracking-tight">반가워요!</h1>
      <p class="mt-2 text-base text-white/75">이메일 주소를 입력해 주세요</p>
      <form class="mt-6 space-y-2.5 text-left" novalidate>
        <input id="email" type="email" autocomplete="email" aria-label="이메일" placeholder="이메일" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <div class="!mt-4 rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 py-2.5 backdrop-blur-md">
          <label class="flex items-center gap-2.5 border-b border-white/15 pb-2.5 text-base font-bold text-white">
            <input type="checkbox" id="terms-all-s1" class="size-[18px] shrink-0 rounded accent-[#b3a4ff]">약관 전체 동의
          </label>
          <div class="pt-1.5">
          <label class="flex items-center gap-2.5 py-1 text-[0.95rem] text-white/90">
            <input type="checkbox" id="terms-service-s1" class="size-[18px] shrink-0 rounded accent-[#b3a4ff]"><span class="flex-1"><b class="font-semibold text-[#b3a4ff]">[필수]</b> 서비스 이용약관 동의</span>
            <span class="cursor-default text-sm text-white/80 underline">보기</span>
          </label>
          <label class="flex items-center gap-2.5 py-1 text-[0.95rem] text-white/90">
            <input type="checkbox" id="terms-privacy-s1" class="size-[18px] shrink-0 rounded accent-[#b3a4ff]"><span class="flex-1"><b class="font-semibold text-[#b3a4ff]">[필수]</b> 개인정보 수집·이용 동의</span>
            <span class="cursor-default text-sm text-white/80 underline">보기</span>
          </label>
          </div>
        </div>
        <button type="button" data-set-state="s2" class="mt-4 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">계속</button>
      </form>
    </div>
    <div data-when="terms-error">
      <div class="flex justify-center gap-2" aria-label="1 / 3 단계"><span class="h-1 w-9 rounded-full bg-[#b3a4ff]"></span><span class="h-1 w-9 rounded-full bg-white/20"></span><span class="h-1 w-9 rounded-full bg-white/20"></span></div>
      <h1 class="mt-7 text-[1.75rem] font-extrabold tracking-tight">반가워요!</h1>
      <p class="mt-2 text-base text-white/75">이메일 주소를 입력해 주세요</p>
      <form class="mt-6 space-y-2.5 text-left" novalidate>
        <input id="email-t" type="email" autocomplete="email" aria-label="이메일" placeholder="이메일" value="owner@sajura.kr" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <div class="!mt-4 rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 py-2.5 backdrop-blur-md">
          <label class="flex items-center gap-2.5 border-b border-white/15 pb-2.5 text-base font-bold text-white">
            <input type="checkbox" id="terms-all-t" class="size-[18px] shrink-0 rounded accent-[#b3a4ff]">약관 전체 동의
          </label>
          <div class="pt-1.5">
          <label class="flex items-center gap-2.5 py-1 text-[0.95rem] text-white/90">
            <input type="checkbox" id="terms-service-t" class="size-[18px] shrink-0 rounded accent-[#b3a4ff]"><span class="flex-1"><b class="font-semibold text-[#b3a4ff]">[필수]</b> 서비스 이용약관 동의</span>
            <span class="cursor-default text-sm text-white/80 underline">보기</span>
          </label>
          <label class="flex items-center gap-2.5 py-1 text-[0.95rem] text-white/90">
            <input type="checkbox" id="terms-privacy-t" class="size-[18px] shrink-0 rounded accent-[#b3a4ff]"><span class="flex-1"><b class="font-semibold text-[#b3a4ff]">[필수]</b> 개인정보 수집·이용 동의</span>
            <span class="cursor-default text-sm text-white/80 underline">보기</span>
          </label>
          </div>
        </div>
        <p class="px-1 text-sm text-[#ffd6d6]" role="alert">필수 약관에 동의해 주세요.</p>
        <button type="button" class="mt-4 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">계속</button>
      </form>
    </div>
    <div data-when="email-error">
      <div class="flex justify-center gap-2" aria-label="1 / 3 단계"><span class="h-1 w-9 rounded-full bg-[#b3a4ff]"></span><span class="h-1 w-9 rounded-full bg-white/20"></span><span class="h-1 w-9 rounded-full bg-white/20"></span></div>
      <h1 class="mt-7 text-[1.75rem] font-extrabold tracking-tight">반가워요!</h1>
      <p class="mt-2 text-base text-white/75">이메일 주소를 입력해 주세요</p>
      <form class="mt-6 space-y-2.5 text-left" novalidate>
        <input id="email-e" type="email" autocomplete="email" aria-label="이메일" placeholder="이메일" value="owner@sajura.kr" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <p class="px-1 text-sm text-[#ffd6d6]" role="alert">이미 가입된 이메일입니다.</p>
        <div class="!mt-4 rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 py-2.5 backdrop-blur-md">
          <label class="flex items-center gap-2.5 border-b border-white/15 pb-2.5 text-base font-bold text-white">
            <input type="checkbox" id="terms-all-e" checked class="size-[18px] shrink-0 rounded accent-[#b3a4ff]">약관 전체 동의
          </label>
          <div class="pt-1.5">
          <label class="flex items-center gap-2.5 py-1 text-[0.95rem] text-white/90">
            <input type="checkbox" id="terms-service-e" checked class="size-[18px] shrink-0 rounded accent-[#b3a4ff]"><span class="flex-1"><b class="font-semibold text-[#b3a4ff]">[필수]</b> 서비스 이용약관 동의</span>
            <span class="cursor-default text-sm text-white/80 underline">보기</span>
          </label>
          <label class="flex items-center gap-2.5 py-1 text-[0.95rem] text-white/90">
            <input type="checkbox" id="terms-privacy-e" checked class="size-[18px] shrink-0 rounded accent-[#b3a4ff]"><span class="flex-1"><b class="font-semibold text-[#b3a4ff]">[필수]</b> 개인정보 수집·이용 동의</span>
            <span class="cursor-default text-sm text-white/80 underline">보기</span>
          </label>
          </div>
        </div>
        <button type="button" class="mt-4 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">계속</button>
      </form>
    </div>
    <div data-when="s2">
      <div class="flex justify-center gap-2" aria-label="2 / 3 단계"><span class="h-1 w-9 rounded-full bg-white/20"></span><span class="h-1 w-9 rounded-full bg-[#b3a4ff]"></span><span class="h-1 w-9 rounded-full bg-white/20"></span></div>
      <h1 class="mt-7 text-[1.75rem] font-extrabold tracking-tight">이름을 알려 주세요</h1>
      <p class="mt-2 text-base text-white/75">사장님 이름을 입력해 주세요</p>
      <form class="mt-6 space-y-2.5 text-left" novalidate>
        <input id="name" autocomplete="name" aria-label="이름" placeholder="이름" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <button type="button" data-set-state="s3" class="mt-4 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">계속</button>
      </form>
    </div>
    <div data-when="s3">
      <div class="flex justify-center gap-2" aria-label="3 / 3 단계"><span class="h-1 w-9 rounded-full bg-white/20"></span><span class="h-1 w-9 rounded-full bg-white/20"></span><span class="h-1 w-9 rounded-full bg-[#b3a4ff]"></span></div>
      <h1 class="mt-7 text-[1.75rem] font-extrabold tracking-tight">비밀번호를 만들어 주세요</h1>
      <p class="mt-2 text-base text-white/75">8자 이상으로 입력해 주세요</p>
      <form class="mt-6 space-y-2.5 text-left" novalidate>
        <input id="password" type="password" autocomplete="new-password" aria-label="비밀번호" placeholder="비밀번호" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <input id="password_confirm" type="password" autocomplete="new-password" aria-label="비밀번호 확인" placeholder="비밀번호 확인" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <button type="submit" data-go="02_login.html?state=registered" class="mt-4 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">가입하기</button>
      </form>
    </div>
    <div data-when="pw-error">
      <div class="flex justify-center gap-2" aria-label="3 / 3 단계"><span class="h-1 w-9 rounded-full bg-white/20"></span><span class="h-1 w-9 rounded-full bg-white/20"></span><span class="h-1 w-9 rounded-full bg-[#b3a4ff]"></span></div>
      <h1 class="mt-7 text-[1.75rem] font-extrabold tracking-tight">비밀번호를 만들어 주세요</h1>
      <p class="mt-2 text-base text-white/75">8자 이상으로 입력해 주세요</p>
      <form class="mt-6 space-y-2.5 text-left" novalidate>
        <input id="password-e" type="password" autocomplete="new-password" aria-label="비밀번호" placeholder="비밀번호" value="password1234" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <input id="password_confirm-e" type="password" autocomplete="new-password" aria-label="비밀번호 확인" placeholder="비밀번호 확인" value="password12" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <p class="px-1 text-sm text-[#ffd6d6]" role="alert">비밀번호가 일치하지 않습니다.</p>
        <button type="button" class="mt-4 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">가입하기</button>
      </form>
    </div>

    <p class="mt-6 text-[0.95rem] text-white">이미 계정이 있으신가요? <a href="02_login.html" class="font-bold text-white hover:underline">로그인</a></p>
  </section>
</main>
</body>
</html>
