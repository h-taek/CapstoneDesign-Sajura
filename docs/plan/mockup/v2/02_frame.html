<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공용 틀 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 모든 화면이 함께 쓰는 틀(배경·상단 바·메뉴·본문 패널·하단 알약)만 보는 견본. 본문 카드는 자리 표시 -->
<body data-page="frame">
<div data-shell="home" data-title="공용 틀">
  <div class="space-y-4 lg:space-y-5">
    <div class="grid grid-cols-2 gap-3 lg:grid-cols-4 lg:gap-4">
      <div class="glass-card flex h-28 items-center justify-center rounded-2xl text-ink-3">카드</div>
      <div class="glass-card flex h-28 items-center justify-center rounded-2xl text-ink-3">카드</div>
      <div class="glass-card flex h-28 items-center justify-center rounded-2xl text-ink-3">카드</div>
      <div class="glass-card flex h-28 items-center justify-center rounded-2xl text-ink-3">카드</div>
    </div>
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
      <div class="glass-card flex h-64 items-center justify-center rounded-2xl text-ink-3 lg:col-span-2">넓은 카드</div>
      <div class="glass-card flex h-64 items-center justify-center rounded-2xl text-ink-3">카드</div>
    </div>
    <!-- 패널 안에서 스크롤되는지 보려고 길게 채운다 -->
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <div class="glass-card flex h-72 items-center justify-center rounded-2xl text-ink-3">카드</div>
      <div class="glass-card flex h-72 items-center justify-center rounded-2xl text-ink-3">카드</div>
    </div>
  </div>
</div>
</body>
</html>
