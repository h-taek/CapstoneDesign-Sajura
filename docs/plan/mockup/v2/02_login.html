<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/login.tsx, components/ui/button.tsx·field.tsx. v2는 AuthHeroPanel(왼쪽 설명 글)을 뺐다 -->
<body data-page="login" data-states="기본:default,가입 완료:registered,탈퇴 안내:withdrawn,로그인 실패:error">
<div data-backdrop></div>
<!-- v2 — 하늘과 동네가 화면 전체에 보이게 폼은 가운데 카드 한 장. 왼쪽 위 로고는 시작 화면으로 돌아간다 -->
<a href="01_intro.html" aria-label="사주라 소개" class="fixed top-5 left-5 z-10 flex items-center gap-2 text-[var(--sky-fg)] sm:top-6 sm:left-8">
  <span class="flex size-8 items-center justify-center rounded-lg bg-brand text-sm font-black text-white">사</span>
  <span class="text-xl font-extrabold tracking-tight">사주라</span>
</a>
<main class="grid min-h-dvh place-items-center px-3 pt-16 pb-[6vh] sm:px-6 sm:pt-20 sm:pb-[12vh]">
  <section class="glass-strong w-full max-w-[440px] rounded-[1.75rem] p-6 sm:p-8">
    <header class="space-y-1.5">
      <h1 class="text-[1.75rem] font-extrabold tracking-tight text-ink">어서 오세요, 사장님</h1>
      <p class="text-base text-ink-2">로그인하고 오늘 밤부터 사주라에게 맡겨 보세요.</p>
    </header>

    <output data-when="registered" class="mt-6 block rounded-xl bg-emerald-50 p-3 text-sm text-emerald-700">회원가입이 완료되었습니다. 로그인해주세요.</output>
    <output data-when="withdrawn" class="mt-6 block rounded-xl bg-subtle p-3 text-sm text-ink-2">탈퇴가 접수되었습니다. 30일 뒤 매장 데이터를 포함한 모든 정보가 삭제됩니다.</output>

    <form class="mt-6 space-y-3.5" novalidate>
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-[0.95rem] font-semibold text-ink-2">아이디(이메일)</label>
        <input id="email" type="email" autocomplete="email" placeholder="아이디를 입력해 주세요." value="owner@sajura.kr" class="h-[52px] w-full rounded-xl border border-line bg-white/70 px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft">
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-[0.95rem] font-semibold text-ink-2">비밀번호</label>
        <div class="relative">
          <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요." value="password1234" class="h-[52px] w-full rounded-xl border border-line bg-white/70 px-4 pr-12 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft">
          <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-ink-3" aria-label="비밀번호 표시">
            <img src="../../../../Front/src/assets/login/eye-icon.svg" alt="" class="size-6">
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between gap-2 text-sm text-ink-3">
        <label class="flex items-center gap-2">
          <input type="checkbox" checked class="size-5 rounded accent-brand">
          다음에도 기억하기
        </label>
        <span class="cursor-default underline">비밀번호를 잊으셨나요?</span>
      </div>

      <p data-when="error" class="text-sm text-red-600" role="alert">이메일 또는 비밀번호가 올바르지 않습니다.</p>

      <button type="submit" data-go-dashboard class="inline-flex h-[52px] w-full items-center justify-center rounded-2xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">로그인</button>
    </form>

    <p class="mt-4 text-center text-[0.95rem] text-ink-2">처음이신가요? <a href="03_register.html" class="font-bold text-brand hover:underline">회원가입</a></p>

    <div class="my-5 flex items-center gap-3">
      <span class="h-px flex-1 bg-line"></span>
      <span class="text-sm text-ink-3">또는 간편 로그인</span>
      <span class="h-px flex-1 bg-line"></span>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <button type="button" data-go-dashboard data-provider="google" class="inline-flex h-[52px] w-full items-center justify-center gap-1.5 sm:gap-2 rounded-2xl border border-line bg-white/80 px-3 text-sm whitespace-nowrap sm:text-[0.95rem] font-semibold text-ink-2 transition-colors hover:bg-white">
        <span class="relative size-6 shrink-0">
          <img src="../../../../Front/src/assets/login/google-g-1.svg" alt="" class="absolute inset-0 size-full">
          <img src="../../../../Front/src/assets/login/google-g-2.svg" alt="" class="absolute inset-0 size-full">
          <img src="../../../../Front/src/assets/login/google-g-3.svg" alt="" class="absolute inset-0 size-full">
          <img src="../../../../Front/src/assets/login/google-g-4.svg" alt="" class="absolute inset-0 size-full">
        </span>
        구글 로그인
      </button>
      <!-- 카카오 버튼 색·문구는 카카오 로그인 디자인 규정을 따르고 높이만 맞춘다 -->
      <button type="button" data-go-dashboard data-provider="kakao" class="inline-flex h-[52px] w-full items-center justify-center gap-1.5 sm:gap-2 rounded-2xl bg-[#ffdf20] px-3 text-sm whitespace-nowrap sm:text-[0.95rem] font-semibold text-ink-2 transition-colors hover:bg-[#f5d500]">
        <img src="../../../../Front/src/assets/login/kakao-icon.svg" alt="" class="h-[22px] w-[24px] shrink-0">
        카카오 로그인
      </button>
    </div>
  </section>
</main>
</body>
</html>
