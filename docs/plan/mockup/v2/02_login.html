<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/login.tsx, components/ui/button.tsx·field.tsx. v2는 AuthHeroPanel(왼쪽 설명 글)을 뺐다 -->
<body data-page="login" data-sky="21:30" data-sky-steps="default:21:30,withdrawn:21:30,error:21:30,registered:22:15" data-states="기본:default,가입 완료:registered,탈퇴 안내:withdrawn,로그인 실패:error">
<div data-backdrop></div>
<!-- v2 — 회원가입과 같은 방식. 카드 없이 밤하늘 위에 바로, 'Sajura'는 제목 바로 위 가운데(사용자 지시). 가입 완료 상태는 회원가입 마지막 단계와 같은 22:15 하늘(달 위치가 이어진다).
     하늘 위라 브랜드 보라 대신 밝은 보라(#b3a4ff)를 강조색으로 쓴다 -->
<main class="min-h-dvh px-5 pt-[8vh] pb-10 text-center text-white">
  <section class="mx-auto w-full max-w-[400px]">
    <p class="text-[2rem] leading-none font-extrabold tracking-tight text-[#b3a4ff]">Sajura</p>
    <h1 class="mt-4 text-[1.75rem] font-extrabold tracking-tight">어서 오세요, 사장님</h1>
    <!-- 알림·오류는 부제 자리에 대신 보여 높이를 그대로 둔다(아래쪽 글이 분홍 하늘로 밀리지 않게) -->
    <p data-when="default" class="mt-2 text-base text-white/75">로그인하고 오늘 밤부터 사주라에게 맡겨 보세요.</p>
    <p data-when="registered" class="mt-2 text-base font-semibold text-[#c8f7dc]" role="status">가입이 완료되었어요. 로그인해 주세요.</p>
    <p data-when="withdrawn" class="mt-2 text-base font-semibold text-white" role="status">탈퇴가 접수되었어요. 30일 뒤 삭제돼요.</p>
    <p data-when="error" class="mt-2 text-base font-semibold text-[#ffd6d6]" role="alert">이메일 또는 비밀번호가 올바르지 않아요.</p>


    <form class="mt-7 space-y-3 text-left" novalidate>
      <input id="email" type="email" autocomplete="email" aria-label="이메일" placeholder="이메일" value="owner@sajura.kr" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
      <div class="relative">
        <input id="password" type="password" autocomplete="current-password" aria-label="비밀번호" placeholder="비밀번호" value="password1234" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none pr-12">
        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2" aria-label="비밀번호 표시">
          <!-- 원본 아이콘 선이 회색(#6A7282)이라 어두운 칸 위에서는 희게 바꾼다 -->
          <img src="../../../../Front/src/assets/login/eye-icon.svg" alt="" class="h-4 w-[22px] brightness-0 invert opacity-75">
        </button>
      </div>
      <label class="flex items-center gap-2.5 pt-1 text-sm text-white/90">
        <input type="checkbox" checked class="size-[18px] rounded accent-[#b3a4ff]">
        다음에도 기억하기
      </label>


      <button type="submit" data-go-dashboard class="!mt-6 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">로그인</button>
    </form>

        <p class="mt-6"><span class="inline-flex items-center gap-4 text-[0.95rem] text-white">
      <a href="03_register.html" class="font-bold hover:underline">회원가입</a>
      <span class="h-3.5 w-px bg-white/40" aria-hidden="true"></span>
      <span class="cursor-default">비밀번호 재설정</span>
    </span></p>

    <div class="mt-7 flex items-center gap-3">
      <span class="h-px flex-1 bg-white/25"></span>
      <span class="text-sm text-white">간편 로그인</span>
      <span class="h-px flex-1 bg-white/25"></span>
    </div>

    <!-- 간편 로그인 — 둥근 아이콘 버튼. 카카오 색은 카카오 로그인 디자인 규정을 따른다 -->
    <div class="mt-4 flex justify-center gap-4">
      <button type="button" data-go-dashboard data-provider="kakao" aria-label="카카오 로그인" class="flex size-[52px] items-center justify-center rounded-full bg-[#ffdf20] transition-colors hover:bg-[#f5d500]">
        <img src="../../../../Front/src/assets/login/kakao-icon.svg" alt="" class="h-[22px] w-[24px]">
      </button>
      <button type="button" data-go-dashboard data-provider="google" aria-label="구글 로그인" class="flex size-[52px] items-center justify-center rounded-full bg-white transition-colors hover:bg-subtle">
        <span class="relative size-6">
          <img src="../../../../Front/src/assets/login/google-g-1.svg" alt="" class="absolute inset-0 size-full">
          <img src="../../../../Front/src/assets/login/google-g-2.svg" alt="" class="absolute inset-0 size-full">
          <img src="../../../../Front/src/assets/login/google-g-3.svg" alt="" class="absolute inset-0 size-full">
          <img src="../../../../Front/src/assets/login/google-g-4.svg" alt="" class="absolute inset-0 size-full">
        </span>
      </button>
    </div>
  </section>
</main>
</body>
</html>
