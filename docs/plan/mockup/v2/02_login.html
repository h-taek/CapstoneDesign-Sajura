<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/login.tsx, components/ui/button.tsx·field.tsx. v2는 AuthHeroPanel(왼쪽 설명 글)을 뺐다 -->
<body data-page="login" data-states="기본:default,가입 완료:registered,탈퇴 안내:withdrawn,로그인 실패:error">
<div data-backdrop></div>
<!-- v2 — 하늘과 동네가 화면 전체에 보이게 폼은 가운데 카드 한 장(안쪽은 가운데 정렬, 맨 위 브랜드색 Sajura·제목·안내 글만 있는 입력칸·둥근 간편 로그인) -->
<main class="grid min-h-dvh place-items-center px-3 pt-16 pb-[6vh] sm:px-6 sm:pt-16 sm:pb-[8vh]">
  <section class="glass-strong w-full max-w-[440px] rounded-[1.75rem] p-6 text-center sm:p-7">
    <p class="text-[2rem] leading-none font-black tracking-tight text-brand">Sajura</p>
    <h1 class="mt-4 text-[1.6rem] leading-snug font-extrabold tracking-tight text-ink">어서 오세요, 사장님</h1>
    <p class="mt-1.5 text-base text-ink-2">로그인하고 오늘 밤부터 사주라에게 맡겨 보세요.</p>


    <output data-when="registered" class="mt-4 block rounded-xl bg-emerald-50 p-3 text-sm text-emerald-700">회원가입이 완료되었습니다. 로그인해주세요.</output>
    <output data-when="withdrawn" class="mt-4 block rounded-xl bg-subtle p-3 text-sm text-ink-2">탈퇴가 접수되었습니다. 30일 뒤 매장 데이터를 포함한 모든 정보가 삭제됩니다.</output>

    <form class="mt-4 space-y-2.5 text-left" novalidate>
      <input id="email" type="email" autocomplete="email" aria-label="이메일" placeholder="이메일" value="owner@sajura.kr" class="h-[52px] w-full rounded-xl border border-line bg-white/70 px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft">
      <div class="relative">
        <input id="password" type="password" autocomplete="current-password" aria-label="비밀번호" placeholder="비밀번호" value="password1234" class="h-[52px] w-full rounded-xl border border-line bg-white/70 px-4 pr-12 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft">
        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-ink-3" aria-label="비밀번호 표시">
          <img src="../../../../Front/src/assets/login/eye-icon.svg" alt="" class="h-4 w-[22px]">
        </button>
      </div>
      <label class="flex items-center gap-2 pt-1 text-sm text-ink-3">
        <input type="checkbox" checked class="size-[18px] rounded accent-brand">
        다음에도 기억하기
      </label>

      <p data-when="error" class="text-sm text-red-600" role="alert">이메일 또는 비밀번호가 올바르지 않습니다.</p>

      <button type="submit" data-go-dashboard class="!mt-4 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">로그인</button>
    </form>

    <p class="mt-4 flex items-center justify-center gap-4 text-[0.95rem] text-ink-3">
      <a href="03_register.html" class="font-bold text-ink hover:underline">회원가입</a>
      <span class="h-3.5 w-px bg-ink/20" aria-hidden="true"></span>
      <span class="cursor-default">비밀번호 재설정</span>
    </p>

    <div class="mt-4 flex items-center gap-3">
      <span class="h-px flex-1 bg-line"></span>
      <span class="text-sm text-ink-3">간편 로그인</span>
      <span class="h-px flex-1 bg-line"></span>
    </div>

    <!-- 간편 로그인 — 둥근 아이콘 버튼. 카카오 색은 카카오 로그인 디자인 규정을 따른다 -->
    <div class="mt-3.5 flex justify-center gap-4">
      <button type="button" data-go-dashboard data-provider="kakao" aria-label="카카오 로그인" class="flex size-[52px] items-center justify-center rounded-full bg-[#ffdf20] transition-colors hover:bg-[#f5d500]">
        <img src="../../../../Front/src/assets/login/kakao-icon.svg" alt="" class="h-[22px] w-[24px]">
      </button>
      <button type="button" data-go-dashboard data-provider="google" aria-label="구글 로그인" class="flex size-[52px] items-center justify-center rounded-full border border-line bg-white transition-colors hover:bg-subtle">
        <span class="relative size-6">
          <img src="../../../../Front/src/assets/login/google-g-1.svg" alt="" class="absolute inset-0 size-full">
          <img src="../../../../Front/src/assets/login/google-g-2.svg" alt="" class="absolute inset-0 size-full">
          <img src="../../../../Front/src/assets/login/google-g-3.svg" alt="" class="absolute inset-0 size-full">
          <img src="../../../../Front/src/assets/login/google-g-4.svg" alt="" class="absolute inset-0 size-full">
        </span>
      </button>
    </div>
  </section>
</main>
</body>
</html>
