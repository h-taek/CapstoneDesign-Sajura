<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사업자 검증 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/verify-business.tsx, components/ui/button.tsx·field.tsx -->
<body data-page="verify" data-states="기본:default,반려됨:rejected">
<div data-backdrop></div>
<main class="grid min-h-dvh place-items-center p-6">
  <section class="w-full max-w-[560px] space-y-8 rounded-2xl p-10 glass-strong">
    <header class="space-y-2">
      <h1 class="text-3xl font-semibold text-ink">매장 인증을 완료해주세요</h1>
      <p class="text-base text-ink-2">사업자등록번호와 등록증을 제출하면 검증 후 다음 단계로 진행합니다.</p>
    </header>

    <output data-when="rejected" class="block rounded-xl bg-red-50 p-3 text-sm text-red-700">반려됨: 사업자등록증 이미지가 흐려 번호를 확인할 수 없습니다 — 확인 후 다시 제출해주세요.</output>

    <form class="space-y-6" novalidate>
      <div class="flex flex-col gap-1.5">
        <label for="business_no" class="text-[0.95rem] font-semibold text-ink-2">사업자등록번호</label>
        <input id="business_no" inputmode="numeric" placeholder="사업자등록번호를 입력해 주세요." value="123-45-67890" class="h-[58px] w-full rounded-xl border border-line bg-subtle px-4 text-base text-ink placeholder:text-ink-4 focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand-soft disabled:bg-subtle disabled:text-ink-3">
        <p class="text-sm text-ink-3">123-45-67890</p>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="cert" class="text-[0.95rem] font-semibold text-ink-2">사업자등록증</label>
        <div class="flex items-center gap-3">
          <!-- 첨부 전 문구: 사업자등록증(파일을 첨부해주세요) -->
          <div class="flex h-[58px] flex-1 items-center rounded-xl border border-line bg-subtle px-4 text-base text-ink-3">사업자등록증_사주라화덕피자.pdf</div>
          <button type="button" class="inline-flex h-[58px] shrink-0 items-center justify-center gap-2 rounded-xl bg-ink px-6 text-base font-medium whitespace-nowrap text-white transition-colors hover:bg-ink disabled:cursor-not-allowed disabled:bg-ink-4">파일 찾기</button>
          <input id="cert" type="file" accept="image/*,application/pdf" class="hidden">
        </div>
        <p class="text-sm text-ink-3">이미지(jpg/png) 또는 PDF, 최대 10MB</p>
      </div>

      <button type="submit" data-go="05_onboarding-store.html" class="inline-flex h-[68px] w-full shrink-0 items-center justify-center gap-2 rounded-full bg-brand px-5 text-xl font-semibold whitespace-nowrap text-white transition-colors hover:bg-brand-strong disabled:cursor-not-allowed disabled:bg-ink-4">제출하기</button>
    </form>
  </section>
</main>
</body>
</html>
