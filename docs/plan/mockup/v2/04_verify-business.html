<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사업자 검증 — 사주라 목업 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.17"></script>
<script src="mockup.js" defer></script>
</head>
<!-- 원본: Front/src/routes/verify-business.tsx, components/ui/button.tsx·field.tsx -->
<body data-page="verify" data-states="기본:default,반려됨:rejected">
<div data-backdrop></div>
<!-- v2 — 회원가입과 같은 방식. 카드 없이 밤하늘 위에 바로, 'Sajura'는 왼쪽 위, 제목은 위에서 13vh 높이에 고정, 입력칸은 어두운 반투명.
     기본은 처음 들어온 빈 폼, 반려됨은 냈던 값이 채워진 폼에 부제 자리로 반려 사유를 보여 준다 -->
<p class="fixed top-6 left-6 z-10 text-[1.75rem] leading-none font-extrabold tracking-tight text-[#b3a4ff] sm:top-8 sm:left-10">Sajura</p>
<main class="min-h-dvh px-5 pt-[13vh] pb-10 text-center text-white">
  <section class="mx-auto w-full max-w-[400px]">
    <h1 class="text-[1.75rem] font-extrabold tracking-tight">매장 인증을 해 주세요</h1>
    <div data-when="default">
      <p class="mt-2 text-base text-white/75">사업자등록번호와 등록증을 올리면<br>확인 후 다음 단계로 넘어가요</p>
      <form class="mt-8 space-y-3 text-left" novalidate>
        <input id="business_no-a" inputmode="numeric" aria-label="사업자등록번호" placeholder="사업자등록번호 (숫자 10자리)" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <div class="flex items-center gap-2">
          <div class="flex h-[52px] min-w-0 flex-1 items-center rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base backdrop-blur-md"><span class="truncate text-white/70">사업자등록증 파일</span></div>
          <button type="button" class="inline-flex h-[52px] shrink-0 items-center justify-center rounded-xl border border-white/15 bg-white/15 bg-clip-padding px-4 text-base font-semibold text-white backdrop-blur-md transition-colors hover:bg-white/25">파일 찾기</button>
          <input id="cert-a" type="file" accept="image/*,application/pdf" class="hidden">
        </div>
        <p class="px-1 text-sm text-white/85">이미지(jpg·png) 또는 PDF, 최대 10MB</p>
        <button type="submit" data-go="05_onboarding.html" class="mt-6 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">제출하기</button>
      </form>
    </div>
    <div data-when="rejected">
      <p class="mt-2 text-base font-semibold text-[#ffd6d6]" role="alert">반려됐어요. 등록증 이미지가 흐려<br>번호를 확인할 수 없어요. 다시 올려 주세요</p>
      <form class="mt-8 space-y-3 text-left" novalidate>
        <input id="business_no-b" inputmode="numeric" aria-label="사업자등록번호" placeholder="사업자등록번호 (숫자 10자리)" value="123-45-67890" class="h-[52px] w-full rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base text-white placeholder:text-white/70 backdrop-blur-md focus:border-[#b3a4ff] focus:ring-4 focus:ring-[#b3a4ff]/25 focus:outline-none">
        <div class="flex items-center gap-2">
          <div class="flex h-[52px] min-w-0 flex-1 items-center rounded-xl border border-white/15 bg-[#0d0a26]/45 px-4 text-base backdrop-blur-md"><span class="truncate text-white">사업자등록증_사주라화덕피자.pdf</span></div>
          <button type="button" class="inline-flex h-[52px] shrink-0 items-center justify-center rounded-xl border border-white/15 bg-white/15 bg-clip-padding px-4 text-base font-semibold text-white backdrop-blur-md transition-colors hover:bg-white/25">파일 찾기</button>
          <input id="cert-b" type="file" accept="image/*,application/pdf" class="hidden">
        </div>
        <p class="px-1 text-sm text-white/85">이미지(jpg·png) 또는 PDF, 최대 10MB</p>
        <button type="submit" data-go="05_onboarding.html" class="mt-6 inline-flex h-[52px] w-full items-center justify-center rounded-xl bg-brand px-5 text-lg font-bold text-white transition-colors hover:bg-brand-strong">제출하기</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
