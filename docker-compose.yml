# 사주라 Compose stack — service_design.md §11.1 (6 services).
# plan/be/phase_02_infra.md M2.B1.
#
# 사용:  docker compose up -d   →   6 컨테이너 healthy
# 환경:  .env (루트, .env.example 참고)

services:
  mysql:
    image: mysql:8.0
    container_name: sajura-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sajura-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: sajura-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  be:
    build:
      context: .
      dockerfile: docker/be/Dockerfile
    container_name: sajura-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - be_uploads:/app/uploads   # 사업자등록증 등 업로드 파일 영속 (security.md §4.2)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile
    container_name: sajura-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/ai/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  arq-worker:
    build:
      context: .
      dockerfile: docker/arq/Dockerfile
    container_name: sajura-arq-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      DB_HOST: mysql
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q arq /proc/1/cmdline"]
      interval: 20s
      timeout: 5s
      retries: 5

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    container_name: sajura-caddy
    restart: unless-stopped
    depends_on:
      be:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  n8n_data:
  caddy_data:
  caddy_config:
  be_uploads:
