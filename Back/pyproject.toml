[project]
name = "sajura-be"
version = "0.1.0"
description = "사주라 Backend (FastAPI + SQLAlchemy async + Alembic)"
requires-python = ">=3.12,<3.13"
# Library set is the contract in docs/spec/09_service_design.md §1.
# Phase 2 bootstrap intentionally pins the runtime essentials only; per-domain
# libs (Authlib, Playwright, pywebpush, etc.) get added in their phase.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "gunicorn==23.0.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "orjson==3.10.12",
    "SQLAlchemy==2.0.36",
    "aiomysql==0.2.0",
    "PyMySQL==1.1.1",
    "cryptography==44.0.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "arq==0.26.3",
    "structlog==24.4.0",
    "asgi-correlation-id==4.3.4",
    "sentry-sdk[fastapi]==2.19.2",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    # Phase 3 인증
    "Authlib==1.3.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "email-validator==2.2.0",
    "phonenumbers==8.13.50",
    "itsdangerous==2.2.0",
    "aiobreaker==1.2.0",
    # Phase 4 POS·CSV
    "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "ipython==8.30.0",
    "rich==13.9.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
